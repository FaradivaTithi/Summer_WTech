<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration Form</title>
</head>
<body>
 
    <h1>Student Registration Form</h1>
 
    <form action="#" method="post">
 
        <fieldset>
            <legend>Personal Information</legend>
 
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>
            <br><br>
 
            <label for="studentid">Student ID:</label>
            <input type="text" id="studentid" name="studentid"
                   placeholder="Enter your ID" required>
            <br><br>
 
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
            <br><br>
 
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>
            <br><br>
 
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
 
            <label>Gender:</label><br>
 
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
 
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
 
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
 
        </fieldset>
 
        <br>
 
        <fieldset>
            <legend>Academic Information</legend>
 
            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="CSE" selected>CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="English">English</option>
                <option value="Civil Engineering">Civil Engineering</option>
            </select>
            <br><br>
 
            <label for="semester">Semester:</label>
            <select id="semester" name="semester" required>
                <option value="">Select Semester</option>
                <option value="1st Semester">1st Semester</option>
                <option value="2nd Semester">2nd Semester</option>
                <option value="3rd Semester">3rd Semester</option>
                <option value="4th Semester">4th Semester</option>
                <option value="5th Semester">5th Semester</option>
                <option value="6th Semester">6th Semester</option>
                <option value="7th Semester">7th Semester</option>
                <option value="8th Semester">8th Semester</option>
            </select>
 
        </fieldset>
 
        <br>
 
        <fieldset>
            <legend>Skills</legend>
 
            <label>Programming Languages Known:</label><br>
 
            <input type="checkbox" id="c" name="language" value="C">
            <label for="c">C</label>
 
            <input type="checkbox" id="cpp" name="language" value="C++">
            <label for="cpp">C++</label>
 
            <input type="checkbox" id="java" name="language" value="Java">
            <label for="java">Java</label>
 
            <input type="checkbox" id="python" name="language" value="Python">
            <label for="python">Python</label>
 
            <input type="checkbox" id="javascript" name="language" value="JavaScript">
            <label for="javascript">JavaScript</label>
 
        </fieldset>
 
        <br>
 
        <fieldset>
            <legend>Additional Information</legend>
 
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40"
                      placeholder="Enter your address"></textarea>
            <br><br>
 
            <label for="photo">Student Photo:</label>
            <input type="file" id="photo" name="photo">
            <br><br>
 
            <label for="comment">Comments:</label><br>
            <textarea id="comment" name="comment"
                      rows="5" cols="40"
                      maxlength="200"
                      placeholder="Write your comments here"></textarea>
 
        </fieldset>
 
        <br>
 
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
 
    </form>
 
</body>
</html>
