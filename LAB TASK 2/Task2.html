<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Club Membership Registration</title>
    <link rel="stylesheet" href="Task2.css">
</head>
<body>
 
<div class="container">
 
<h2>University Club Membership Registration</h2>
 
<form id="clubForm">
 
<label>First Name</label>
<input type="text" id="fname">
 
<label>Last Name</label>
<input type="text" id="lname">
 
<label>Email Address</label>
<input type="email" id="email">
 
<label>Password</label>
<input type="password" id="password">
 
<label>Gender</label>
 
<div class="gender">
<input type="radio" name="gender" value="Male"> Male
 
<input type="radio" name="gender" value="Female"> Female
 
<input type="radio" name="gender" value="Other"> Other
</div>
 
<label>Interested Clubs</label>
 
<div class="club">
<input type="checkbox" name="club" value="Programming"> Programming Club<br>
 
<input type="checkbox" name="club" value="Robotics"> Robotics Club<br>
 
<input type="checkbox" name="club" value="Photography"> Photography Club<br>
 
<input type="checkbox" name="club" value="Sports"> Sports Club
</div>
 
<label>Club Category</label>
 
<select id="category">
<option value="">Select Category</option>
<option value="Academic">Academic</option>
<option value="Cultural">Cultural</option>
<option value="Sports">Sports</option>
</select>
 
<label>Why do you want to join?</label>
 
<textarea id="reason" rows="3"></textarea>
 
<button type="submit" id="submitBtn">
Submit
</button>
 
</form>
 
<p id="message"></p>
 
</div>
 
<script src="Task2.js"></script>
 
</body>
</html>
